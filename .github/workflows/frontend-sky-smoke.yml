name: Frontend sky smoke checks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/painterly-parallax-check.mjs'
      - 'tests/paint-normal-check.mjs'
      - 'tests/paint-blend-check.mjs'
      - 'package*.json'
      - '.github/workflows/frontend-sky-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sky-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/painterly-parallax-check.mjs
      - name: Paint surface normals and closed topology
        run: |
          node tests/paint-normal-check.mjs
          node tests/paint-blend-check.mjs
      - run: npm run build
