name: Remote desktop playthrough

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Existing route suite to run
        type: choice
        default: all
        options: [all, continuous, player, faults, controls, contacts, glass]

permissions:
  contents: read

concurrency:
  group: remote-desktop-playthrough
  cancel-in-progress: false

jobs:
  desktop:
    name: desktop-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'continuous' && '["continuous"]' || inputs.suite == 'player' && '["player"]' || inputs.suite == 'faults' && '["faults"]' || inputs.suite == 'controls' && '["controls"]' || inputs.suite == 'contacts' && '["wall-rail","roof"]' || inputs.suite == 'glass' && '["glass"]' || '["continuous","player","faults","controls"]') }}
    env:
      REMOTE_QA_SUITE: ${{ matrix.suite }}
      GOAL_FLIGHT_TIMEOUT_MS: '600000'
      GOAL_CONTACT_TIMEOUT_MS: '180000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Browser safety entry inspection
        run: node tests/browser-safety-check.mjs
      - name: Arrival feedback CPU regression (no browser launch)
        run: |
          node tests/room-flight-arrival-cpu.mjs
          ARRIVAL_CPU_FRAME_MS=5000 node tests/room-flight-arrival-cpu.mjs
          ARRIVAL_CPU_SCENARIO=roof ARRIVAL_CPU_FRAME_MS=5000 ARRIVAL_CPU_IO_MS=1000 ARRIVAL_CPU_TIMEOUT_MS=600000 node tests/room-flight-arrival-cpu.mjs
          ARRIVAL_CPU_SCENARIO=doorway ARRIVAL_CPU_FRAME_MS=5000 ARRIVAL_CPU_IO_MS=1000 ARRIVAL_CPU_TIMEOUT_MS=600000 node tests/room-flight-arrival-cpu.mjs
          node tests/room-entry-arrival-cpu.mjs
          node tests/static-contact-attribution-cpu.mjs
          node tests/glass-contact-route-cpu.mjs
          node tests/studio-framing-cpu.mjs
      - run: npm run build
      - name: Install matched Linux Chromium
        run: npx playwright install --with-deps chromium
      - name: Install remote X11 capture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Serial real-input routes (stop on first failure)
        run: xvfb-run -a -s "-screen 0 1600x1100x24" node tests/remote-desktop-review.mjs
      - name: Preserve screenshots, videos and reports, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playthrough-${{ matrix.suite }}-${{ github.sha }}
          path: |
            screenshots/remote-desktop/
            tests/remote-*.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
