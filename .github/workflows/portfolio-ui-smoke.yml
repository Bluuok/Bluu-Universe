name: Portfolio UI smoke checks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/core/PortfolioNavigation.js'
      - 'src/core/ProjectBook.js'
      - 'src/main.js'
      - 'src/style.css'
      - 'index.html'
      - 'tests/portfolio-navigation-check.mjs'
      - 'package*.json'
      - '.github/workflows/portfolio-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/portfolio-navigation-check.mjs
      - run: npm run build
