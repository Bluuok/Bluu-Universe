name: Remote render environment probe

on:
  workflow_dispatch:
    inputs:
      check:
        description: Bounded diagnostic, not full route acceptance
        type: choice
        default: ui-surface
        options: [ui-surface, arrival, paint-surface, opengl]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      REMOTE_RENDER_CHECK: ${{ inputs.check }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch frozen RC83 material for the bounded A/B
        if: inputs.check == 'paint-surface'
        run: git fetch --no-tags --depth=1 origin e326bc410bb369380a3717530819747f6ee93cda
      - run: node tests/browser-safety-check.mjs
      - name: Flight arrival CPU regression (no browser launch)
        run: |
          node tests/room-flight-arrival-cpu.mjs
          ARRIVAL_CPU_FRAME_MS=5000 node tests/room-flight-arrival-cpu.mjs
          ARRIVAL_CPU_SCENARIO=roof ARRIVAL_CPU_FRAME_MS=5000 ARRIVAL_CPU_IO_MS=1000 ARRIVAL_CPU_TIMEOUT_MS=600000 node tests/room-flight-arrival-cpu.mjs
          ARRIVAL_CPU_SCENARIO=doorway ARRIVAL_CPU_FRAME_MS=5000 ARRIVAL_CPU_IO_MS=1000 ARRIVAL_CPU_TIMEOUT_MS=600000 node tests/room-flight-arrival-cpu.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1-mesa-dri
      - name: Bounded full-quality environment check
        timeout-minutes: ${{ inputs.check == 'paint-surface' && 8 || 5 }}
        run: xvfb-run -a -s "-screen 0 1600x1100x24" node tests/remote-render-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-probe-${{ github.sha }}
          path: |
            tests/remote-render-probe.json
            screenshots/remote-desktop/render-probe/
          retention-days: 1
