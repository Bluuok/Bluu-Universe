name: Game mouse-look regression

on:
  pull_request:
    paths:
      - 'src/core/FlightLookInput.js'
      - 'src/core/Interaction.js'
      - 'src/core/SpaceController.js'
      - 'src/core/CameraDirector.js'
      - 'src/main.js'
      - 'tests/flight-look-input-check.mjs'
      - 'tests/flight-mouselook-browser-check.mjs'
      - 'package*.json'
      - '.github/workflows/game-mouselook.yml'
  workflow_dispatch:

permissions:
  contents: read

# Browser rendering is GPU/CPU intensive; keep only the newest PR revision.
concurrency:
  group: game-mouselook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Input ownership and movement invariants
        run: node tests/flight-look-input-check.mjs
      - name: Production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install relative X11 pointer driver
        run: sudo apt-get install -y xdotool
      - name: Real Chromium pointer-lock and RMB playthrough
        run: xvfb-run -a env PLAYWRIGHT_HEADED=1 NATIVE_X11_MOUSE=1 node tests/flight-mouselook-browser-check.mjs
